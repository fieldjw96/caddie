# Second-agent review, the last Gate before a pull request can auto-merge. There is no human
# in that loop: the verdict this workflow leaves is the only thing between a Run's pull
# request and it merging itself.
#
# Ported from rolodeck-ai, whose copy is where these steps were developed and where the
# comments' war stories happened. The one deliberate difference is the fork guard on the job,
# which that repo does not need and this one does. See "THIS REPO IS PUBLIC" below.

name: Claude Review

on:
  pull_request:
    # `synchronize` is deliberately absent. It fired a full review on every push, so a pull
    # request that took three fixes cost four reviews. Re-review after a bounce is requested
    # explicitly by the dispatcher posting `/review`.
    types: [opened, reopened, ready_for_review]
    # A pull request that edits this file cannot be reviewed: claude-code-action refuses to
    # run unless the workflow is byte-identical to the copy on the default branch. Not
    # scheduling the job is honest, where a red check would claim a review ran.
    paths-ignore:
      - ".github/workflows/claude-review.yml"
  issue_comment:
    types: [created]

env:
  PR: ${{ github.event.pull_request.number || github.event.issue.number }}
  REPO: ${{ github.repository }}

jobs:
  review:
    # THIS REPO IS PUBLIC, which rolodeck-ai is not, and this condition is the consequence.
    # The checkout below takes the pull request's head code, and the job then runs with a
    # token that can write reviews. On a private repo taking no outside contributions that is
    # fine. On a public one, anybody may open a pull request from a fork, so without this
    # guard a stranger's branch would execute here. Same-repo pull requests only, and
    # `/review` only from the repository owner.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      checks: write
      # Required by "Check other CI before reviewing". Without it the statusCheckRollup query
      # fails outright with "Resource not accessible by integration" rather than returning
      # what it could read, which looks exactly like a Gate that has stopped working.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      # An APPROVED badge on a pull request whose own CI is red is a claim the reviewer has no
      # basis for. This runs before the agent so a red or unresolved build never reaches it.
      #
      # Excludes this workflow's own check by name: the job running this step always shows
      # IN_PROGRESS in the rollup, and waiting on itself would never clear. Getting that
      # exclusion wrong is the failure mode that breaks silently, bouncing every pull request
      # after a full timeout regardless of its actual CI.
      - name: Check other CI before reviewing
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          timeout=1200
          interval=20
          waited=0

          while true; do
            rollup=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup --jq '.statusCheckRollup')

            # CheckRun reports status/conclusion; StatusContext reports state. Normalised to
            # one shape so nothing below cares which kind a check is.
            others=$(echo "$rollup" | jq -c --arg wf "$WORKFLOW" '
              [ .[] | select(.workflowName != $wf and .name != "review") | {
                  name: (.name // .context),
                  bucket: (
                    if .__typename == "StatusContext" then
                      (if .state == "SUCCESS" then "SUCCESS"
                       elif .state == "PENDING" or .state == "EXPECTED" then "PENDING"
                       else "FAILURE" end)
                    elif .status != "COMPLETED" then "PENDING"
                    else .conclusion end
                  )
                }
              ]')

            count=$(echo "$others" | jq 'length')
            if [ "$count" -eq 0 ]; then
              echo "No other checks exist on this pull request; proceeding without them."
              printf '%s\n' "No CI checks exist on this pull request, so this review proceeds without waiting on any." > /tmp/ci-status.md
              {
                echo "note<<CINOTE"
                echo "No CI checks exist on this pull request, so this review proceeded without waiting on any."
                echo "CINOTE"
                echo "skip_agent=false"
              } >> "$GITHUB_OUTPUT"
              break
            fi

            failing=$(echo "$others" | jq -c '[ .[] | select(.bucket == "FAILURE" or .bucket == "TIMED_OUT" or .bucket == "CANCELLED") ]')
            if [ "$(echo "$failing" | jq 'length')" -gt 0 ]; then
              names=$(echo "$failing" | jq -r '[.[].name] | join(", ")')
              echo "Failing check(s): $names"
              {
                echo "REQUEST_CHANGES"
                echo "This pull request's own CI is not green: $names. There is nothing to review while the change does not build; fix the build and comment /review to try again."
              } > /tmp/verdict.txt
              echo "skip_agent=true" >> "$GITHUB_OUTPUT"
              break
            fi

            pending=$(echo "$others" | jq -c '[ .[] | select(.bucket == "PENDING") ]')
            if [ "$(echo "$pending" | jq 'length')" -eq 0 ]; then
              passedNames=$(echo "$others" | jq -r '[.[].name] | join(", ")')
              echo "All other checks concluded without a failure: $passedNames. Proceeding."
              printf 'This pull request has other CI, and all of it concluded without a failure: %s.\n' "$passedNames" > /tmp/ci-status.md
              echo "skip_agent=false" >> "$GITHUB_OUTPUT"
              break
            fi

            pendingNames=$(echo "$pending" | jq -r '[.[].name] | join(", ")')
            if [ "$waited" -ge "$timeout" ]; then
              echo "Timed out after ${timeout}s still waiting on: $pendingNames"
              {
                echo "REQUEST_CHANGES"
                echo "This pull request's CI had not finished after ${timeout}s: still waiting on $pendingNames. Reviewing against an unknown state would be worse than waiting; comment /review once CI has concluded."
              } > /tmp/verdict.txt
              echo "skip_agent=true" >> "$GITHUB_OUTPUT"
              break
            fi

            echo "Waiting on: $pendingNames (${waited}s/${timeout}s elapsed)"
            sleep "$interval"
            waited=$((waited + interval))
          done

      # The most valuable review question is "does this do what the Ticket asked", and the
      # reviewer cannot ask it from the diff alone. foreman writes `Closes #N` into every pull
      # request body it opens, so the Ticket is recoverable without anything being passed in.
      - name: Fetch the Ticket
        if: steps.ci.outputs.skip_agent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
          n=$(printf '%s' "$body" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
                | head -n1 | grep -oE '[0-9]+' || true)
          if [ -n "$n" ]; then
            gh issue view "$n" --repo "$REPO" --json number,title,body \
              --jq '"Ticket #\(.number): \(.title)\n\n\(.body)"' > /tmp/ticket.md
            echo "Reviewing against Ticket #$n."
          else
            printf '%s\n' \
              'This pull request is linked to no Ticket, so there are no Acceptance' \
              'Criteria to check it against. Review it on its own terms.' > /tmp/ticket.md
            echo "No linked Ticket found; reviewing on the diff alone."
          fi
          gh pr diff "$PR" --repo "$REPO" > /tmp/diff.patch
          wc -l /tmp/diff.patch

      - uses: anthropics/claude-code-action@v1
        id: agent
        if: steps.ci.outputs.skip_agent != 'true'
        # A crashing agent step must not become the job's conclusion when a valid verdict was
        # already written, or an APPROVE shows up as a red X. The failure is still surfaced
        # below, and "Post the verdict" fails the job outright if no verdict was written.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ env.PR }} in ${{ env.REPO }}. You did not
            write this code and you have no memory of writing it. Review it cold.

            The Ticket it claims to satisfy is in /tmp/ticket.md. The diff is in
            /tmp/diff.patch. This pull request's other CI has already been checked; that
            status is in /tmp/ci-status.md. The full repository is checked out at the pull
            request's head, so you can read and search any file for context.

            Work in this order:

            1. Read /tmp/ticket.md, /tmp/diff.patch, and /tmp/ci-status.md.
            2. Read CLAUDE.md and CONTEXT.md, and any ADR in docs/adr/ whose subject the diff
               touches. A change that contradicts an accepted ADR is a finding even when the
               code is correct.
            3. ADR 0001 is this repo's reason for existing in the shape it has. Any new data
               source, any fetch of a host not already used, and any displayed number that was
               read from someone else rather than Derived here, is a finding unless an ADR in
               this same diff amends 0001.
            4. Decide whether the diff satisfies every line of the Ticket's Acceptance
               Criteria. This is the most important question you answer. A criterion silently
               left unmet is the finding this review exists to catch.
            5. Look for correctness bugs: wrong logic, unhandled failure, a case the code does
               not cover, a claim in a comment the code does not honour.
            6. Post findings as inline comments on the diff.
            7. Write your verdict to /tmp/verdict.txt as your final action.

            The verdict file is the only thing that records your review. The job fails if it
            is missing, so write it even when you found nothing. Write exactly one of these
            two forms and nothing else:

              APPROVE<newline><one-line summary>
              REQUEST_CHANGES<newline><one-line summary of what is wrong>

            Request changes only for unmet Acceptance Criteria, correctness bugs, or
            contradictions of an accepted ADR. Style, naming, simplification and efficiency
            suggestions belong in inline comments and must not by themselves hold up a pull
            request.
          # A large diff exhausts a low turn cap before the reviewer writes its verdict, and
          # the job then fails with no verdict at all, posting a red `review` check on a pull
          # request the Gate had already approved. A review that reads 37 files needs room to
          # read them.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Write,Bash(cat:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

      - name: Note the agent step's failure in the job summary
        if: always() && steps.agent.outcome == 'failure'
        run: |
          {
            echo "### The review agent step did not exit cleanly"
            echo ""
            echo "Step outcome: \`${{ steps.agent.outcome }}\`; action-reported conclusion:" \
                 "\`${{ steps.agent.outputs.conclusion || 'unknown' }}\`."
            echo "Any verdict recorded below still stands, but it came from a run that" \
                 "failed afterwards, not a clean one."
          } >> "$GITHUB_STEP_SUMMARY"

      # The agent states a verdict; this step records it. Never let the thing being judged also
      # be the thing that reports the judgement: an earlier version asked the agent to call
      # `gh pr review` itself, enforced only by prose, and it silently did not.
      - name: Post the verdict
        if: always()
        id: post_verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing file fails the job rather than passing it. Silence is indistinguishable
          # from a review that never ran, and this repo merges on APPROVED without a human.
          if [ ! -s /tmp/verdict.txt ]; then
            echo "::error::No verdict file was written, so no review is recorded. Failing" \
                 "rather than passing. Comment /review on the pull request to try again."
            echo "recorded=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          verdict=$(head -n 1 /tmp/verdict.txt | tr -d '\r' | tr -d '[:space:]')
          summary=$(tail -n +2 /tmp/verdict.txt | head -c 60000)
          [ -n "$summary" ] || summary="(no summary given)"

          note="${{ steps.ci.outputs.note }}"
          if [ -n "$note" ]; then
            # printf, not a literal multi-line string. A continuation line that dedents to
            # column 0 ends the YAML block scalar and the whole workflow stops being valid
            # YAML, which GitHub reports as a startup failure with no jobs and no reason.
            summary="$(printf '%s\n\n%s' "$summary" "$note")"
          fi

          case "$verdict" in
            APPROVE)
              echo "Verdict: APPROVE"
              gh pr review "$PR" --repo "$REPO" --approve --body "$summary"
              echo "recorded=true" >> "$GITHUB_OUTPUT"
              ;;
            REQUEST_CHANGES)
              echo "Verdict: REQUEST_CHANGES"
              gh pr review "$PR" --repo "$REPO" --request-changes --body "$summary"
              echo "recorded=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unrecognised verdict '$verdict'; expected APPROVE or REQUEST_CHANGES."
              echo "recorded=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

      # An `issue_comment` run starts on the default branch, so its automatic per-job check
      # lands there rather than on the pull request, leaving whatever check an earlier
      # `pull_request` run posted for that head commit sitting unanswered. This posts one
      # explicitly, against the actual head commit, under this job's own name.
      - name: Post a check on the pull request's head commit
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "${{ steps.post_verdict.outputs.recorded }}" = "true" ]; then
            conclusion=success
            summary="A verdict was recorded for this head commit; see the review on the pull request for what it was."
          else
            conclusion=failure
            summary="No verdict was recorded for this head commit; see this run's job log for why. Comment /review to try again."
          fi
          gh api "repos/$REPO/check-runs" \
            --method POST \
            -f name="review" \
            -f head_sha="$sha" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f output.title="Claude Review" \
            -f output.summary="$summary"
