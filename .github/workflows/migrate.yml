# Applies db/migrations to production whenever main changes, so a schema change reaches the
# database with the code that reads it rather than at the next daily ingest, up to a day later.
#
# Every push to main, not only one that touches db/: `drizzle-kit migrate` applies only what
# the database has not seen, so a push with no new migration costs half a minute and changes
# nothing, and there is no path filter to get wrong. Also by hand from the Actions tab, and as
# a reusable workflow (`workflow_call`) so the daily ingest can run this same job as its first
# step. The ingest also migrates first as its own first stage. Both run the same
# `npm run db:migrate` over the same db/migrations, and it applies only what is missing, so the
# two cannot disagree about the schema, whichever runs first.
#
# The credential is not a repository secret. It is POSTGRES_URL_NON_POOLING, a secret of the
# GitHub Environment `production`, which is restricted to the main branch. Only a job that
# names that environment can read it, the way rolodeck-ai's ADR 0014 scopes its migration
# credential. It must be the direct, non-pooling connection: DDL does not survive a
# transaction-mode pooler, and the step before the migration refuses one that looks pooled.
#
# What this cannot promise on its own: Vercel's Git integration starts building the same push
# at the same moment, so without more, the new code could start serving before this finishes.
# Vercel's Deployment Checks close that gap: with this job ("Apply migrations to production")
# required there, Vercel does not promote a production deployment until it has passed. That
# is a Vercel project setting, not something a file in this repo can turn on. See the README.

name: Migrate

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apply:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # One migration at a time against production, and never cancelled halfway through one.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      # The name drizzle.config.ts reads. Given nothing but the direct connection.
      DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Nothing after checkout needs git credentials.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Says whether it is set and whether it looks pooled, never what it is.
      - name: Check the connection is set, and direct
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=No production database::The production environment's secret POSTGRES_URL_NON_POOLING is not set. Set it with: gh secret set POSTGRES_URL_NON_POOLING --env production"
            exit 1
          fi
          case "$DATABASE_URL" in
            *pgbouncer=true* | *:6543/*)
              echo "::error title=Pooled connection::POSTGRES_URL_NON_POOLING looks like a transaction-mode pooler (port 6543 or pgbouncer=true). Migrations need the direct connection."
              exit 1
              ;;
          esac

      - run: npm run db:migrate
