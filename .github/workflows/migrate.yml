# Applies db/migrations to production, by hand from the Actions tab and as a reusable workflow
# (`workflow_call`) so the daily ingest can run this same job as its first step. The ingest
# also migrates first as its own first stage. Both run the same `npm run db:migrate` over the
# same db/migrations, and it applies only what the database has not seen, so the two cannot
# disagree about the schema, whichever runs first.
#
# It does not run on a push to main. It used to, and .github/workflows/deploy.yml now does that
# migration itself, as the step before the deploy, so that a push produces one ordered sequence
# rather than two workflows racing to apply the same migration. Leaving the push trigger here
# would put a second, unordered migration alongside that one. What remains is the manual and
# reusable route, which is what the ingest and a person need. See docs/adr/0003.
#
# The credential is not a repository secret. It is POSTGRES_URL_NON_POOLING, a secret of the
# GitHub Environment `production`, which is restricted to the main branch. Only a job that
# names that environment can read it, the way rolodeck-ai's ADR 0014 scopes its migration
# credential. It must be the direct, non-pooling connection: DDL does not survive a
# transaction-mode pooler, and the step before the migration refuses one that looks pooled.

name: Migrate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apply:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # One migration at a time against production, and never cancelled halfway through one.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      # The name drizzle.config.ts reads. Given nothing but the direct connection.
      DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Nothing after checkout needs git credentials.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Says whether it is set and whether it looks pooled, never what it is.
      - name: Check the connection is set, and direct
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=No production database::The production environment's secret POSTGRES_URL_NON_POOLING is not set. Set it with: gh secret set POSTGRES_URL_NON_POOLING --env production"
            exit 1
          fi
          case "$DATABASE_URL" in
            *pgbouncer=true* | *:6543/*)
              echo "::error title=Pooled connection::POSTGRES_URL_NON_POOLING looks like a transaction-mode pooler (port 6543 or pgbouncer=true). Migrations need the direct connection."
              exit 1
              ;;
          esac

      - run: npm run db:migrate
