# The only thing that writes data to production (migrate.yml writes only its schema). The site
# reads; this populates what it reads, from nothing if need be: migrations first, then every
# ingest in dependency order, then a count of what is stored. See lib/ingest/stages.ts for the order and why it is that order.
#
# Daily, at 06:17 UTC, and by hand from the Actions tab. Golf results change weekly at most,
# after a Tournament's Sunday, and the schedule and course facts more rarely still, so a day
# is already more often than anything upstream changes. Hourly would be 24 times the load on
# Wikipedia and OpenGolfAPI, both of them free to use and asking to be used politely, for no
# fresher answer. 06:17 is after OpenGolfAPI's daily allowance resets at 00:00 UTC, off the
# hour when everyone else's cron fires, and before a European morning reads the page.
#
# OpenGolfAPI allows 500 anonymous requests a day and a run needs about 100, all from the
# courses stage, which matches every stored season rather than only the current one. Two
# seasons' schedules name mostly the same venues, so the second season costs a dozen searches
# rather than another season's worth. That stage checks what it needs against what is left
# before it asks — at most three requests for each distinct Course name, about 160 of the 500
# for the two seasons stored today — reads the server's own remaining count as it goes, and if
# it would run out it stops, writes nothing and fails: a table is never half filled.
# `concurrency` below means a manual run queues behind a scheduled one rather than both
# spending the same allowance at once.
#
# The connection string is the repository secret CADDIE_DATABASE_URL and nothing else. It
# reaches the scripts as DATABASE_URL, the name db/client.ts and drizzle.config.ts read. It is
# never echoed: every line a stage prints is redacted by scripts/ingest-stage.ts before it is
# shown or kept, and the last step fails the run if any kept log still shows a credential.
#
# The last stage, rankable, is the verdict: it fails the run, after every stage above it has
# had its chance to finish, if the next Tournament still cannot be ranked. See
# lib/ingest/rankable.ts for the three ways that can be true. A failure there opens an issue
# titled below, or comments on the one already open, rather than a new one per day; the next
# passing run comments and closes it. #51 is why this exists: eight green runs in a row said,
# in plain words, that the site could not be ranked, and stayed green anyway.

name: Ingest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  ISSUE_TITLE: "The next Tournament cannot be ranked"

jobs:
  # Migrations before any stage. Usually there is nothing left to apply, because deploy.yml
  # migrated each merge as it happened, but this ingest does not assume that: the migrate
  # stage below stays in too, so the stages still run as one sequence from nothing, locally
  # too. All three run `npm run db:migrate` over the same db/migrations, applying only what
  # the database has not seen, so they cannot disagree about the schema, and if production's
  # migration fails, no stage writes.
  migrate:
    uses: ./.github/workflows/migrate.yml
    # A reusable workflow called with `uses:` receives none of the caller's secrets unless they
    # are passed. Without this the migrate job runs, reaches its own connection check, and
    # reports POSTGRES_URL_NON_POOLING as unset even though it is set on the production
    # environment and the very same job succeeds when it runs on its own. Proven both
    # ways: run 35781367155 failed here while run 35776303632, the same job by itself with the
    # same secret, passed its check and applied the migrations.
    secrets: inherit

  ingest:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      DATABASE_URL: ${{ secrets.CADDIE_DATABASE_URL }}
    steps:
      # `runner.temp` is not available in a job-level `env:` block: the runner context only
      # exists once a step is running, so using it above makes the whole file unparseable and
      # every run fails before any job starts, with no log to read. Set here instead, from
      # RUNNER_TEMP, which is an ordinary environment variable the runner always exports.
      - name: Put the ingest logs somewhere outside the checkout
        run: echo "INGEST_LOG_DIR=$RUNNER_TEMP/ingest-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          # Nothing after checkout needs git credentials, and leaving them persisted makes the
          # job token readable to `npm ci`'s install scripts and to every ingest.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Says whether it is set and never what it is.
      - name: Check CADDIE_DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=No production database::The repository secret CADDIE_DATABASE_URL is not set. Set it with: gh secret set CADDIE_DATABASE_URL"
            exit 1
          fi
          {
            echo "### Ingest stages"
            echo ""
            echo "| Stage | Script | Outcome |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      # One step per stage, so the run page says which one failed, and each stage's script
      # also names itself in an error annotation. A failed stage stops the run: every later
      # stage reads what the earlier ones stored.
      - name: "Stage: migrate"
        run: npx tsx scripts/ingest-stage.ts migrate
      - name: "Stage: schedule"
        run: npx tsx scripts/ingest-stage.ts schedule
      - name: "Stage: players"
        run: npx tsx scripts/ingest-stage.ts players
      - name: "Stage: courses"
        run: npx tsx scripts/ingest-stage.ts courses
      - name: "Stage: course facts"
        run: npx tsx scripts/ingest-stage.ts course facts
      - name: "Stage: results"
        run: npx tsx scripts/ingest-stage.ts results
      - name: "Stage: course traits"
        run: npx tsx scripts/ingest-stage.ts course traits
      - name: "Stage: strengths"
        run: npx tsx scripts/ingest-stage.ts strengths
      - name: "Stage: report"
        run: npx tsx scripts/ingest-stage.ts report
      - name: "Stage: rankable"
        id: rankable
        run: npx tsx scripts/ingest-stage.ts rankable

      # Only the rankable stage above can fail here: every earlier stage already stopped the
      # run itself if it failed. Opens the one issue this failure gets, or comments on it if
      # it is already open, with what rankable printed, from its own already-redacted log.
      - name: Open or update the issue for an unrankable next Tournament
        if: failure() && steps.rankable.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/rankable-issue.md"
          log="$INGEST_LOG_DIR/rankable.log"
          {
            if [ -s "$log" ]; then cat "$log"; else echo "The rankable stage failed before it could report why."; fi
            echo ""
            echo "Run: $RUN_URL"
          } > "$body"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            echo "::error title=Next Tournament cannot be ranked::Still failing. Updated issue #$number."
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body")
            echo "::error title=Next Tournament cannot be ranked::Opened $url"
          fi

      # Whether the stages passed or not: a failed stage is the likeliest to have printed a
      # driver error with a URL in it.
      - name: Check no log shows a credential
        if: always()
        run: npx tsx scripts/ingest-check-logs.ts

      # Only once everything above, rankable included, has passed: the issue above is closed
      # rather than left open once the site it describes is fixed.
      - name: Close the issue now the next Tournament can be ranked
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN_URL"
          fi
